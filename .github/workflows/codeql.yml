# Static security analysis of the JS/TS code (free for public repositories).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1' # Mondays, for new queries against unchanged code

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
