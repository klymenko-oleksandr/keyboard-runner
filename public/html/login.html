<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <script defer type="module" src="/javascript/login.mjs"></script>
  <title>Keyboard Runner</title>
</head>

<body>
  <div id="root">
    <div class="checker-band" aria-hidden="true"></div>
    <div id="login-page" class="login-layout">
      <section class="login-hero">
        <h1 class="brand brand-large">Keyboard Runner</h1>
        <p class="login-lead">A real-time typing race. Everyone gets the same text, and the first driver across the line wins.</p>
        <div class="login-form">
          <label for="username-input" class="field-label">Your driver name</label>
          <div class="login-row">
            <input id="username-input" class="input" autofocus placeholder="username" type="text" maxlength="20" autocomplete="off" spellcheck="false">
            <button id="submit-button" class="btn btn-primary btn-large no-select">Enter the grid</button>
          </div>
          <p id="login-error" class="form-error" role="alert"></p>
        </div>
      </section>
      <section id="briefing" class="briefing"></section>
    </div>

    <div id="mobile-notice" class="mobile-notice" role="dialog" aria-modal="true" aria-labelledby="mobile-notice-title">
      <div class="mobile-notice-card">
        <div class="checker-band" aria-hidden="true"></div>
        <div class="mobile-notice-body">
          <h2 id="mobile-notice-title">Grab a keyboard</h2>
          <p>Keyboard Runner is a typing race, so it needs a physical keyboard. Open it on a laptop or desktop to play.</p>
          <button id="mobile-notice-continue" class="btn btn-ghost">Continue anyway</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
